    <script>
      // Apply the saved theme before first paint (no flash of the wrong theme).
      // The page title enters once a visit (tasteskill motion.md); later route changes don't animate.
      document.documentElement.classList.add("m-enter");
      setTimeout(function () { document.documentElement.classList.remove("m-enter"); }, 1400);
      try {
        var t = localStorage.getItem("yi-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebApplication","name":"Yatra Insight","applicationCategory":"BusinessApplication","description":"LLM-powered project monitoring and decision support for tourism infrastructure projects."}
    </script>
